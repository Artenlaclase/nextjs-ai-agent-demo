services:
  mysql:
    image: mysql:8.4
    container_name: nextjs-ai-agent-demo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: terapiat_artesagent
      MYSQL_USER: terapiat_artesuser
      MYSQL_PASSWORD: R4ul2026
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -proot']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: